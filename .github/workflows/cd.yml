name: CD

# main -> dev (automatic). Tags v* -> prod (requires approval on the "prod" GitHub environment).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # GitHub OIDC -> AWS IAM role (no long-lived AWS keys)
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
    env:
      ENV_NAME: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev') }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push images
        run: |
          REG=${{ steps.ecr.outputs.registry }}/sentinel-$ENV_NAME
          docker buildx build --platform linux/arm64 -f backend/Dockerfile -t $REG/api:$IMAGE_TAG --push .
          docker buildx build --platform linux/arm64 --build-arg NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.MAPBOX_PUBLIC_TOKEN }} \
            -t $REG/web:$IMAGE_TAG --push frontend
          docker buildx build --platform linux/amd64 -f airflow/Dockerfile -t $REG/airflow:$IMAGE_TAG --push .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform apply (new task definitions)
        working-directory: infrastructure/terraform/environments/${{ env.ENV_NAME }}
        run: |
          echo '${{ secrets.TFVARS }}' > terraform.tfvars
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG"
          terraform output -json sentinel > /tmp/outputs.json

      - name: Run database migrations (one-off Fargate task)
        run: |
          CLUSTER=$(jq -r .ecs_cluster /tmp/outputs.json)
          TASKDEF=$(jq -r .migrate_task_definition_arn /tmp/outputs.json)
          SUBNETS=$(jq -r '.private_subnet_ids | join(",")' /tmp/outputs.json)
          SG=$(jq -r .api_security_group_id /tmp/outputs.json)
          TASK=$(aws ecs run-task --cluster $CLUSTER --launch-type FARGATE --task-definition $TASKDEF \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks $TASK
          CODE=$(aws ecs describe-tasks --cluster $CLUSTER --tasks $TASK --query 'tasks[0].containers[0].exitCode' --output text)
          test "$CODE" = "0" || { echo "migration failed with exit code $CODE"; exit 1; }

      - name: Wait for services to stabilise
        run: |
          CLUSTER=$(jq -r .ecs_cluster /tmp/outputs.json)
          aws ecs wait services-stable --cluster $CLUSTER --services api web

      - name: Publish Airflow DAGs to MWAA
        run: |
          BUCKET=$(jq -r .buckets.mwaa /tmp/outputs.json)
          (cd airflow/plugins && zip -qr /tmp/plugins.zip .)
          aws s3 sync airflow/dags s3://$BUCKET/dags --delete --sse aws:kms
          aws s3 cp /tmp/plugins.zip s3://$BUCKET/plugins.zip --sse aws:kms
          aws s3 cp airflow/requirements.txt s3://$BUCKET/requirements.txt --sse aws:kms

      - name: Smoke test
        run: |
          curl -fsS https://${{ vars.APP_DOMAIN }}/health
          curl -fsS https://${{ vars.APP_DOMAIN }}/ready
