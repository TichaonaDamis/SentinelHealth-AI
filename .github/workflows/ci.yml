name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt -e "ml[plots]" pyarrow
      - name: Ruff
        run: |
          (cd backend && ruff check .)
          ruff check ml airflow tests infrastructure/lambda
      - name: Unit & API tests
        run: pytest -q --junitxml=pytest.xml
      - name: Quick model training smoke test
        run: python -m sentinel_ml.pipelines.train_all --quick --out /tmp/models --report /tmp/report/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: |
            pytest.xml
            /tmp/report/

  migrations:
    name: Migrations (TimescaleDB + PostGIS + pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 20
    env:
      SENTINEL_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ./ml
      - name: Upgrade, downgrade, upgrade
        working-directory: backend
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Seed + scan + warehouse load
        working-directory: backend
        run: |
          python -m app.db.seed --days 200 --regions 8 --scan
          PGPASSWORD=sentinel psql -h localhost -U sentinel -d sentinel -v ON_ERROR_STOP=1 -f ../airflow/dags/sql/load_warehouse.sql

  frontend:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
      - name: Validate environments
        run: |
          for env in dev prod; do
            (cd infrastructure/terraform/environments/$env && terraform init -backend=false -input=false && terraform validate)
          done

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (Python)
        run: pipx run pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Dependency audit (npm)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

  images:
    name: Container images build & scan
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: sentinel-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: sentinel-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Trivy report (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-api.json
      - name: Publish Trivy findings (summary + annotations)
        if: always()
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
                 "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) [\($t)]"' \
            trivy-api.json | sort -u > trivy-api.txt || true
          { echo '### Trivy: sentinel-api (fixable HIGH/CRITICAL)'; echo '```'; cat trivy-api.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '^CRITICAL' trivy-api.txt | head -40 | while read -r line; do echo "::warning title=Trivy::$line"; done
          jq -r '.Results[]? | .Target as $t | .Secrets[]? | "SECRET \(.Severity) \(.RuleID) [\($t)]"' trivy-api.json \
            | sort -u | head -20 | while read -r line; do echo "::warning title=TrivySecret::$line"; done || true
          echo "::notice title=TrivyCounts::vulns=$(wc -l < trivy-api.txt) results=$(jq '.Results | length' trivy-api.json)"
      - name: Trivy gate (fail on fixable critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-api:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true
