# Local full stack: TimescaleDB + PostGIS + pgvector, API, web and (optional) Airflow.
#   cp .env.example .env && docker compose up --build
#   open http://localhost:3000  (epi@sentinelhealth.dev / ChangeMe!2026)
name: sentinelhealth

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes: [pgdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed --days 400 --scan"]
    restart: "no"

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_MAPBOX_TOKEN: "${NEXT_PUBLIC_MAPBOX_TOKEN:-}" }
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: { api: { condition: service_healthy } }
    ports: ["3000:3000"]

  airflow:
    profiles: ["pipelines"]
    build: { context: ., dockerfile: airflow/Dockerfile }
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      SENTINEL_API_URL: http://api:8000
      SENTINEL_API_USER: admin@sentinelhealth.dev
      SENTINEL_API_PASSWORD: ${SENTINEL_SEED_PASSWORD:-ChangeMe!2026}
      SENTINEL_LAKE_DIR: /opt/airflow/lake
      AIRFLOW_CONN_SENTINEL_WAREHOUSE: postgresql://sentinel:sentinel@db:5432/sentinel
    depends_on: { api: { condition: service_healthy } }
    ports: ["8080:8080"]

volumes:
  pgdata:
