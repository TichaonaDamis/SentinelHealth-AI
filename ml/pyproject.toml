[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ml"
version = "0.1.0"
description = "SentinelHealth AI machine-learning library: anomaly detection, forecasting, outbreak classification and spatial clustering."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
deep = ["torch>=2.3"]
prophet = ["prophet>=1.1.5"]
plots = ["matplotlib>=3.8"]
all = ["torch>=2.3", "prophet>=1.1.5", "matplotlib>=3.8"]

[project.scripts]
sentinel-train = "sentinel_ml.pipelines.train_all:main"

[tool.setuptools.packages.find]
include = ["sentinel_ml*"]
